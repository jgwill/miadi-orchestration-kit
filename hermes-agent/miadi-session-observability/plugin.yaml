name: miadi-session-observability
version: 0.1.1
description: Local, redacted Miadi session capture and terminal continuity for Hermes.
author: Miadi
requires_hermes: ">=0.23.0"
homepage: https://github.com/jgwill/miadi-orchestration-kit
requires_plugins:
  - id: miadi
    version_range: ">=0.3.0"
provides_tools: []
provides_hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
  - pre_approval_request
  - post_approval_response
  - post_api_request
  - api_request_error
  - post_compaction
