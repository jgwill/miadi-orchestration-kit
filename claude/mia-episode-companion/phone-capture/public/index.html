<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1512">
<title>Speak to the episode</title>
<style>
  :root { --bg:#0b1512; --panel:#12211c; --line:#2a4a3e; --ink:#e8f1ec; --muted:#9fb3a9; --mint:#7fe0b4; --live:#ff8a7a; --gold:#e8c46a; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, system-ui, sans-serif;
         padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { max-width: 520px; margin: 0 auto; display:flex; flex-direction:column; gap:16px; }
  h1 { font-size: 1.15rem; margin: 4px 0 0; }
  label { display:block; color:var(--gold); font-size:.8rem; font-weight:700; margin-bottom:6px; }
  select { width:100%; min-height:44px; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:.95rem; }
  .record { width:100%; min-height:120px; border:0; border-radius:22px; font-size:1.35rem; font-weight:800; background:var(--mint); color:#062117; }
  .record.live { background:var(--live); color:#2b0906; }
  .record:disabled { opacity:.5; }
  .timer { font: 700 2rem ui-monospace, monospace; text-align:center; color:var(--mint); min-height: 2.4rem; }
  .status { color:var(--muted); font-size:.9rem; min-height:1.3rem; }
  .status.error { color:var(--live); }
  .result { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .result[hidden] { display:none; }
  .result strong { color:var(--mint); }
  .transcript { white-space:pre-wrap; margin-top:10px; color:var(--ink); font-size:.92rem; }
  small { color:var(--muted); font-size:.78rem; }
  .reply { border-color:#477b65; }
  .reply-head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .reply-head strong { color:var(--gold); }
  .reply-actions { display:flex; gap:10px; margin-top:12px; }
  .reply-actions button { flex:1; min-height:48px; border:0; border-radius:13px; font-weight:800; font-size:1rem; background:#263c34; color:var(--ink); }
  .reply-actions button.primary { background:var(--mint); color:#062117; }
  audio { width:100%; margin-top:10px; }
  .autoplay { display:flex; align-items:center; gap:9px; margin-top:12px; color:var(--muted); font-size:.85rem; }
  .autoplay input { width:22px; height:22px; accent-color:var(--mint); }
</style>
</head>
<body>
<main>
  <h1>Speak to the episode</h1>
  <div>
    <label for="episode">Episode</label>
    <select id="episode"><option value="">Loading episodes…</option></select>
  </div>
  <button id="record" class="record" type="button" disabled>Record</button>
  <div id="timer" class="timer" aria-live="off"></div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <section id="result" class="result" hidden aria-live="polite">
    <div id="resultHead"></div>
    <div id="transcript" class="transcript"></div>
  </section>
  <section id="reply" class="result reply" hidden aria-live="polite">
    <div class="reply-head"><strong>Mia</strong><small id="replyMeta"></small></div>
    <div id="replyText" class="transcript"></div>
    <div class="reply-actions">
      <button id="hearReply" class="primary" type="button">Hear Mia</button>
      <button id="copyReply" type="button">Copy</button>
    </div>
    <label class="autoplay"><input id="autoplay" type="checkbox"> Play her reply when it arrives</label>
    <audio id="replyAudio" controls preload="none" hidden></audio>
  </section>
  <div id="replyStatus" class="status" role="status" aria-live="polite"></div>
  <small>Recorded on this phone, stored on gaia in the episode's captures, then heard by the session listening there. Mia's reply appears here. Keep the screen on while you speak.</small>
</main>
<script>
(function () {
  "use strict";
  var select = document.getElementById("episode");
  var button = document.getElementById("record");
  var timer = document.getElementById("timer");
  var status = document.getElementById("status");
  var result = document.getElementById("result");
  var resultHead = document.getElementById("resultHead");
  var transcript = document.getElementById("transcript");
  var replyBox = document.getElementById("reply");
  var replyMeta = document.getElementById("replyMeta");
  var replyText = document.getElementById("replyText");
  var replyAudio = document.getElementById("replyAudio");
  var hearButton = document.getElementById("hearReply");
  var copyButton = document.getElementById("copyReply");
  var replyStatus = document.getElementById("replyStatus");
  var autoplay = document.getElementById("autoplay");
  // A fraction of a second of silence: playing it inside a tap unlocks the element on iOS.
  var SILENT = "data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA";
  var recorder = null, stream = null, chunks = [], startedAt = 0, tick = null, wakeLock = null;
  var state = "loading", pending = null;
  var current = null, waiting = null;
  var WAIT_MS = 15 * 60 * 1000;

  function when(iso) {
    var d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function showReply(reply) {
    var isNew = !current || current.id !== reply.id;
    current = reply;
    replyText.textContent = reply.text;
    replyMeta.textContent = (reply.take ? "take " + reply.take + " · " : "") + when(reply.at);
    if (isNew) {
      replyAudio.pause();
      replyAudio.removeAttribute("src");
      replyAudio.hidden = true;
    }
    hearButton.textContent = "Hear Mia";
    hearButton.disabled = false;
    copyButton.textContent = "Copy";
    replyBox.hidden = false;
    if (isNew && autoplay.checked) playReply();
  }

  // The audio renders on demand, so play() starts inside the tap and needs no second one.
  // On arrival there is no tap, so Safari allows it only if this element was played
  // before: priming it on the Record tap is what earns that.
  function playReply() {
    if (!current) return;
    var src = "api/replies/" + current.id + "/audio";
    if (replyAudio.getAttribute("src") !== src) replyAudio.src = src;
    replyAudio.hidden = false;
    hearButton.textContent = "Voicing…";
    hearButton.disabled = true;
    var started = replyAudio.play();
    if (started && started.catch) {
      started.catch(function () {
        hearButton.textContent = "Tap ▶ below";
        hearButton.disabled = false;
      });
    }
  }

  function primeAudio() {
    try {
      replyAudio.src = SILENT;
      var started = replyAudio.play();
      if (started && started.then) started.then(function () { replyAudio.pause(); replyAudio.removeAttribute("src"); }).catch(function () {});
    } catch (_) {}
  }

  async function replies(episode, take) {
    var query = "api/replies?episode=" + encodeURIComponent(episode) + (take ? "&take=" + take : "");
    var answer = await (await fetch(query)).json();
    return answer.success ? answer.replies : [];
  }

  // Coming back later is a supported way to hear her: the latest reply is shown on open,
  // and a new one appears on its own while the page is open.
  async function loadLatestReply() {
    if (!select.value || waiting) return;
    try {
      var found = await replies(select.value);
      if (!found.length) { if (!current) replyBox.hidden = true; return; }
      if (current && current.id === found[0].id) return; // never interrupt audio already playing
      showReply(found[0]);
    } catch (_) {}
  }

  // The episode belongs in the URL, so a reload, a bookmark or a shared link comes back
  // to the same episode instead of the default one.
  function urlKeepsEpisode() {
    if (!select.value) return;
    try { history.replaceState(null, "", "?episode=" + encodeURIComponent(select.value)); } catch (_) {}
  }

  // A wait outlives a reload or iOS suspending the tab: it is written down, not held in a timer.
  function rememberWait(episode, take) {
    remember("waiting", episode && take ? JSON.stringify({ episode: episode, take: take, since: Date.now() }) : "");
  }

  function resumeWait() {
    var saved = recall("waiting");
    if (!saved) return false;
    try {
      var w = JSON.parse(saved);
      if (!w.episode || w.episode !== select.value || Date.now() - w.since > WAIT_MS) { rememberWait(); return false; }
      waitForReply(w.episode, w.take, w.since);
      return true;
    } catch (_) { return false; }
  }

  function stopWaiting() {
    if (waiting) clearInterval(waiting.timer);
    waiting = null;
  }

  function waitForReply(episode, take, startedAtMs) {
    stopWaiting();
    replyBox.hidden = true;
    var since = startedAtMs || Date.now();
    rememberWait(episode, take);
    async function check() {
      var elapsed = Math.floor((Date.now() - since) / 1000);
      try {
        var found = await replies(episode, take);
        if (found.length) {
          stopWaiting();
          rememberWait();
          replyStatus.textContent = "";
          showReply(found[0]);
          return;
        }
      } catch (_) {}
      if (Date.now() - since > WAIT_MS) {
        stopWaiting();
        rememberWait();
        replyStatus.textContent = "No reply after 15 minutes. It will appear here on its own if it still comes.";
        return;
      }
      replyStatus.textContent = "Waiting for Mia… " + Math.floor(elapsed / 60) + ":" + String(elapsed % 60).padStart(2, "0");
    }
    waiting = { timer: setInterval(check, 4000) };
    check();
  }

  hearButton.addEventListener("click", function () { playReply(); });

  replyAudio.addEventListener("playing", function () {
    hearButton.textContent = "Hear Mia";
    hearButton.disabled = false;
  });

  replyAudio.addEventListener("error", function () {
    hearButton.textContent = "Hear Mia";
    hearButton.disabled = false;
    if (replyAudio.getAttribute("src")) replyStatus.textContent = "Her voice could not be rendered.";
  });

  autoplay.addEventListener("change", function () {
    remember("autoplay", autoplay.checked ? "1" : "0");
    if (autoplay.checked) primeAudio();
  });

  copyButton.addEventListener("click", async function () {
    if (!current) return;
    try {
      await navigator.clipboard.writeText(current.text);
    } catch (_) {
      var area = document.createElement("textarea");
      area.value = current.text;
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }
    copyButton.textContent = "Copied";
    setTimeout(function () { copyButton.textContent = "Copy"; }, 1500);
  });

  select.addEventListener("change", function () {
    stopWaiting();
    rememberWait();
    current = null;
    replyBox.hidden = true;
    replyStatus.textContent = "";
    remember("episode", select.value);
    urlKeepsEpisode();
    loadLatestReply();
  });

  // Keep looking while the page is open, and the moment it comes back to the front:
  // iOS stops timers in a backgrounded tab, which is how a reply was missed.
  setInterval(function () { if (document.visibilityState === "visible") loadLatestReply(); }, 10000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") loadLatestReply(); });

  function say(text, isError) { status.textContent = text; status.className = "status" + (isError ? " error" : ""); }
  function remember(key, value) { try { localStorage.setItem(key, value); } catch (_) {} }
  function recall(key) { try { return localStorage.getItem(key) || ""; } catch (_) { return ""; } }

  // mp4 first: it is what iPhone Safari records and what the Chronicle already keeps out of git.
  function pickType() {
    if (typeof MediaRecorder === "undefined") return null;
    var candidates = ["audio/mp4", "audio/mp4;codecs=mp4a.40.2"];
    for (var i = 0; i < candidates.length; i++) {
      if (!MediaRecorder.isTypeSupported || MediaRecorder.isTypeSupported(candidates[i])) return candidates[i];
    }
    return null;
  }

  function clock() {
    var s = Math.floor((Date.now() - startedAt) / 1000);
    timer.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  async function loadEpisodes() {
    try {
      var answer = await (await fetch("api/episodes")).json();
      var chosen = new URLSearchParams(location.search).get("episode") || recall("episode") || answer.defaultEpisode;
      select.textContent = "";
      answer.episodes.forEach(function (ep) {
        var option = document.createElement("option");
        option.value = ep.path;
        option.textContent = "Episode " + ep.number + " · " + ep.path.replace(/^\d{4}-\d{2}-\d{2}-episode-\d+-/, "").replace(/-/g, " ");
        if (ep.path === chosen) option.selected = true;
        select.appendChild(option);
      });
      setState("idle");
      if (!pickType()) say("This browser cannot record audio/mp4. Use Safari on the iPhone.", true);
      remember("episode", select.value);
      autoplay.checked = recall("autoplay") !== "0"; // on unless William turned it off
      urlKeepsEpisode();
      if (!resumeWait()) loadLatestReply();
    } catch (error) {
      select.innerHTML = "<option value=''>Episodes unavailable</option>";
      say("Could not reach gaia: " + error.message, true);
    }
  }

  // One state machine owns the recorder. Every action begins with a guard on the state,
  // which is what makes a double tap harmless: two taps during the microphone prompt used
  // to start two recorders and two clocks, and only the second clock was ever stopped.
  function setState(next) {
    state = next;
    button.textContent = {
      loading: "Record", idle: "Record", starting: "Opening the mic…",
      recording: "Stop & send", sending: "Sending…", retry: "Send again",
    }[next];
    button.classList.toggle("live", next === "recording");
    button.disabled = !pickType() || next === "loading" || next === "starting" || next === "sending";
    select.disabled = next === "starting" || next === "recording" || next === "sending";
  }

  function tickOn() { tickOff(); startedAt = Date.now(); clock(); tick = setInterval(clock, 500); }
  function tickOff() { if (tick) clearInterval(tick); tick = null; }

  function releaseMic() {
    if (stream) { try { stream.getTracks().forEach(function (track) { track.stop(); }); } catch (_) {} }
    stream = null;
    recorder = null;
  }

  async function holdScreen() { try { if (navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch (_) {} }
  async function releaseScreen() { if (wakeLock) { try { await wakeLock.release(); } catch (_) {} wakeLock = null; } }

  async function start() {
    if (state !== "idle" && state !== "retry") return;
    pending = null;
    setState("starting");
    var media;
    try {
      media = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (error) {
      setState("idle");
      say("Microphone refused: " + error.message, true);
      return;
    }
    if (state !== "starting") { media.getTracks().forEach(function (track) { track.stop(); }); return; }
    stream = media;
    chunks = [];
    try {
      recorder = new MediaRecorder(stream, { mimeType: pickType() });
    } catch (error) {
      releaseMic();
      setState("idle");
      say("This browser refused to record: " + error.message, true);
      return;
    }
    recorder.ondataavailable = function (event) { if (event.data && event.data.size) chunks.push(event.data); };
    recorder.onerror = function () {
      tickOff();
      releaseMic();
      releaseScreen();
      setState("idle");
      say("The recording stopped with an error. Nothing was sent.", true);
    };
    recorder.start(1000);
    tickOn();
    holdScreen();
    result.hidden = true;
    stopWaiting();
    rememberWait();
    replyStatus.textContent = "";
    setState("recording");
    say("Recording for " + select.options[select.selectedIndex].textContent);
  }

  // Stop, and take what the recorder has even if onstop never fires: a stuck recorder
  // must not leave the page counting forever.
  function lastBlob() {
    return new Promise(function (done) {
      var settled = false;
      var give = function () {
        if (settled) return;
        settled = true;
        done(new Blob(chunks, { type: (recorder && recorder.mimeType) || "audio/mp4" }));
      };
      var guard = setTimeout(give, 3000);
      if (!recorder) { clearTimeout(guard); give(); return; }
      recorder.onstop = function () { clearTimeout(guard); give(); };
      try { recorder.stop(); } catch (_) { clearTimeout(guard); give(); }
    });
  }

  async function stop() {
    if (state !== "recording") return;
    setState("sending");
    tickOff();
    var blob = await lastBlob();
    releaseMic();
    releaseScreen();
    if (!blob || blob.size === 0) {
      timer.textContent = "";
      setState("idle");
      say("Nothing was recorded. Try again.", true);
      return;
    }
    await send(blob);
  }

  // A recording whose upload failed is kept, so a dropped connection never loses what
  // William said. The button becomes Send again.
  async function send(blob) {
    setState("sending");
    var episode = select.value;
    remember("episode", episode);
    say("Sending " + (blob.size / 1024 / 1024).toFixed(1) + " MB, then transcribing and storing on gaia…");
    try {
      var response = await fetch("api/takes?episode=" + encodeURIComponent(episode), {
        method: "POST",
        headers: { "content-type": (blob.type || "audio/mp4").split(";")[0] },
        body: blob,
      });
      var answer = await response.json();
      if (!answer.success) throw new Error(answer.error || ("HTTP " + response.status));
      pending = null;
      resultHead.textContent = "";
      var strong = document.createElement("strong");
      strong.textContent = "Take " + answer.take + " is in the episode.";
      resultHead.appendChild(strong);
      resultHead.appendChild(document.createTextNode(answer.transcriptError
        ? " Transcription failed, so no session will wake yet: " + answer.transcriptError
        : " The session listening there will hear it."));
      transcript.textContent = answer.english || "";
      result.hidden = false;
      say("");
      timer.textContent = "";
      setState("idle");
      if (!answer.transcriptError) waitForReply(episode, answer.take);
    } catch (error) {
      pending = blob;
      setState("retry");
      say("Not stored: " + error.message + " Your recording is kept — tap Send again.", true);
    }
  }

  button.addEventListener("click", function () {
    primeAudio(); // this tap is what lets her reply play by itself when it lands
    if (state === "recording") stop();
    else if (state === "retry" && pending) send(pending);
    else start();
  });

  // iOS drops a screen lock when the page goes to the back; take it again on return.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && state === "recording") holdScreen();
  });
  window.addEventListener("pagehide", function () { tickOff(); releaseMic(); });

  loadEpisodes();
})();
</script>
</body>
</html>
