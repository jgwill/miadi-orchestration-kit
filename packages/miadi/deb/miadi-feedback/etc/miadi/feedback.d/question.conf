# The question channel: questions about the system (form question-feedback.yml).
# A user's ~/.config/miadi/feedback.d/question.conf, when present, is read after this file.
REPO=jgwill/miadi-orchestration-kit
LABEL=feedback:question
# Issues opened on or after SINCE, until the end of EXPIRES (UTC). Move EXPIRES to renew.
SINCE=2026-10-29
EXPIRES=2026-11-12
# An issue an outside author opened without a feedback: label comes to this channel too.
CATCH_UNLABELED=no
# The seat: its team, its folder, its brief, and the models it may run on, cheapest first.
TEAM=T7
CWD=/workspace/repos/jgwill/miadi-orchestration-kit
BRIEF=/usr/share/miadi-feedback/briefs/question.md
MODELS="haiku sonnet opus"
# GitHub logins, beside the repository's owner, members and collaborators, whose reports a
# seat may fix and ship without asking. `miadi-feedback trust <login>` adds one for this user.
TRUSTED=""
# The login a seat mentions when a decision is a maintainer's.
NOTIFY=jgwill
# The issue that hears the summary of what the channel handled, once, after EXPIRES.
TRACKING=jgwill/miadi-orchestration-kit#109
