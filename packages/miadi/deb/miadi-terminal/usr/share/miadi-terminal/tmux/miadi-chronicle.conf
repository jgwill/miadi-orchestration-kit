# miadi-chronicle.conf — click a miadi-chronicle: reference in tmux to open it.
#
# Installed by miadi-terminal (jgwill/miadi-orchestration-kit). Needs tmux 3.2
# or later and `set -g mouse on`. `miadi-terminal enable tmux` adds this line
# to your tmux config; reload a running server with `tmux source-file` after:
#
#   source-file -q /usr/share/miadi-terminal/tmux/miadi-chronicle.conf
#
# A click (or a tap, on Termux) that lands ON a reference opens it in the
# browser. tmux binds nothing to MouseUp1Pane by default, so the press still
# selects the pane and a drag still selects text, and a program that asked for
# the mouse (vim, htop) still gets every click: the reference is only looked
# for when no program in the pane has taken the mouse. A double click on a
# reference still copies it, and opens it once.
#
# At the click, tmux keeps the clicked row in the pane option
# @miadi_chronicle_click; only the pane id and three numbers reach the shell.
# The opener joins a reference that wrapped at the pane edge from
# `capture-pane -J` while the pane still shows that row, and trusts only the
# stored row once output has moved it.
#
# tmux looks when the clicked row holds "miadi" or "chronicle", so a scheme
# split by the pane edge is still found from one of its two rows. It reads the
# row from mouse_line, which it cuts at the first wide character before 3.6
# and at a joined emoji (a ZWJ sequence) on 3.7c: a reference after one on the
# same row is not found. A click on a wrapped reference's row that holds
# neither word opens nothing.

bind-key -n MouseUp1Pane if-shell -F "#{&&:#{||:#{m:*miadi*,#{mouse_line}},#{m:*chronicle*,#{mouse_line}}},#{!:#{||:#{pane_in_mode},#{mouse_any_flag}}}}" {
	set-option -p -F -t = @miadi_chronicle_click "#{mouse_line}"
	run-shell -b "/usr/bin/miadi-chronicle-open --open --tmux '#{pane_id}' --row '#{mouse_y}' --column '#{mouse_x}' --width '#{pane_width}' >/dev/null 2>&1 || true"
} {
	send-keys -M
}
