# miadi-chronicle.conf — click a miadi-chronicle: reference in tmux to open it.
#
# Installed by miadi-terminal (jgwill/miadi-orchestration-kit). Needs tmux 3.2
# or later and `set -g mouse on`. `miadi-terminal enable tmux` adds this line
# to your tmux config; reload a running server with `tmux source-file` after:
#
#   source-file -q /usr/share/miadi-terminal/tmux/miadi-chronicle.conf
#
# A click (or a tap, on Termux) that lands ON a reference opens it in the
# browser. tmux binds nothing to MouseUp1Pane by default, so the press still
# selects the pane and a drag still selects text, and a program that asked for
# the mouse (vim, htop) still gets every click: the reference is only looked
# for when no program in the pane has taken the mouse. A double click on a
# reference still copies it, and opens it once.
#
# As the click lands, tmux captures the pane into two paste buffers,
# miadi-chronicle-shown and miadi-chronicle-joined (wrapped rows joined), so
# output printed after the click cannot change what it opens; only the pane
# id, row and column reach the shell. The two buffers are replaced on every
# such click and show in `choose-buffer`.
#
# tmux looks when the clicked row holds "miadi" or "chronicle", in any case,
# so a scheme split by the pane edge is still found from one of its two rows;
# a row of a wrapped reference that holds neither opens nothing. Before 3.6
# (measured on 3.2a and 3.4) tmux cuts the row it checks at the first wide
# character, so a reference after one on the same row is not found there.

bind-key -n MouseUp1Pane if-shell -F "#{&&:#{||:#{m/i:*miadi*,#{mouse_line}},#{m/i:*chronicle*,#{mouse_line}}},#{!:#{||:#{pane_in_mode},#{mouse_any_flag}}}}" {
	capture-pane -t = -b miadi-chronicle-shown
	capture-pane -J -t = -b miadi-chronicle-joined
	run-shell -b "/usr/bin/miadi-chronicle-open --open --tmux '#{pane_id}' --row '#{mouse_y}' --column '#{mouse_x}' >/dev/null 2>&1 || true"
} {
	send-keys -M
}
