# miadi-chronicle.conf — click a miadi-chronicle: reference in tmux to open it.
#
# Installed by miadi-terminal (jgwill/miadi-orchestration-kit). Needs tmux 3.2
# or later and `set -g mouse on`. Before 3.6, tmux cuts the line it reports
# at the first wide character (measured on 3.2a and 3.4), so a reference that
# follows one on the same line is not found there. `miadi-terminal enable tmux` adds this line to your tmux
# config; reload a running server with `tmux source-file` after:
#
#   source-file -q /usr/share/miadi-terminal/tmux/miadi-chronicle.conf
#
# A click (or a tap, on Termux) that lands ON a reference opens it in the
# browser. Everything else about a click is unchanged: tmux binds nothing to
# MouseUp1Pane by default, the press still selects the pane, a drag still
# selects text, and a program that asked for the mouse (vim, htop) still gets
# every click, because the reference is only looked for when no program in
# the pane has taken the mouse.

bind-key -n MouseUp1Pane if-shell -F "#{&&:#{m:*miadi-chronicle:*,#{mouse_line}},#{!:#{||:#{pane_in_mode},#{mouse_any_flag}}}}" {
	run-shell -b "/usr/bin/miadi-chronicle-open --open --line #{q:mouse_line} --column #{mouse_x} >/dev/null 2>&1 || true"
} {
	send-keys -M
}
