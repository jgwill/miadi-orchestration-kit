# /etc/miadi/tmux.conf: the tmux settings every user of a Miadi host starts with.
#
# Installed by miadi-terminal (jgwill/miadi-orchestration-kit) and read by /etc/tmux.conf. Each line
# is one that mia, jgi and ava had in their own ~/.tmux.conf on gaia (2026-10-09). A user's
# ~/.tmux.conf is read after this file, so a line there wins. `miadi-terminal enable defaults`
# comments out the lines of a user's config that repeat one here, keeping a backup.
# A running tmux server reads it with: tmux source-file /etc/tmux.conf

# Key combinations such as Shift+Enter reach a program that asks for them.
set -g extended-keys on
# The program in a pane learns when its pane gains or loses focus.
set -g focus-events on
# 256 colours, and 24-bit colour from any 256-colour terminal outside tmux.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# A click selects a pane and the wheel reaches tmux; a click on a miadi-chronicle reference needs it.
set -g mouse on
# Each new pane keeps 50,000 lines of scrollback.
set -g history-limit 50000
# The wheel scrolls tmux's scrollback 3 lines at a time and never sends arrow keys to the pane.
# A program that asked for the mouse (vim, htop) gets the wheel itself.
bind -n WheelUpPane if -Ft= '#{mouse_any_flag}' 'send -M' \
  'if -Ft= "#{pane_in_mode}" "send -M" "copy-mode -e; send -X -N 3 scroll-up"'
bind -n WheelDownPane if -Ft= '#{mouse_any_flag}' 'send -M' \
  'if -Ft= "#{pane_in_mode}" "send -X -N 3 scroll-down" "send -M"'
