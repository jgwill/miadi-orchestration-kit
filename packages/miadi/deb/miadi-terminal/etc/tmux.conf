# /etc/tmux.conf: every tmux on this machine reads this file first, then the user's ~/.tmux.conf,
# so a line a user writes there wins over a setting here.
#
# Installed by miadi-terminal (jgwill/miadi-orchestration-kit). The Miadi settings live in
# /etc/miadi/tmux.conf, which this line reads. Add this host's own settings below it.
source-file -q /etc/miadi/tmux.conf
